services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - peruana_net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  frontend:
    env_file:
      - ./envs/.env.production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always

  backend:
    env_file:
      - ./envs/.env.production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  mysql:
    env_file:
      - ./envs/.env.production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always

  backup:
    image: alpine:latest
    depends_on:
      - mysql
    volumes:
      - ./backups:/backups
      - ./scripts/backup_daemon.sh:/usr/local/bin/backup_daemon.sh
      - uploads_data:/app/public/uploads:ro
    env_file:
      - ./envs/.env.production
    command: >
      /bin/sh -c "apk add --no-cache mysql-client && chmod +x /usr/local/bin/backup_daemon.sh && /usr/local/bin/backup_daemon.sh"
    networks:
      - peruana_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    restart: always
