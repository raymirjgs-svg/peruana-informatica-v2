version: '3.8'

services:
  # ============================================
  # 🌐 Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: peruana_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - peruana_net_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 🔐 SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: peruana_certbot_prod
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - peruana_net_prod
    restart: unless-stopped

  # ============================================
  # 🎨 Frontend (Next.js Production)
  # ============================================
  frontend:
    build:
      context: ./peruana-informatica/frontend
      dockerfile: Dockerfile.prod
    container_name: peruana_frontend_prod
    env_file:
      - ./envs/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${FRONTEND_URL:-http://200.58.98.122}
      - INTERNAL_API_URL=http://backend:3001
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - peruana_net_prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # ⚙️ Backend API (Node.js/Express Production)
  # ============================================
  backend:
    build:
      context: ./peruana-informatica/backend
      dockerfile: Dockerfile.prod
    container_name: peruana_backend_prod
    env_file:
      - ./envs/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
    expose:
      - "3001"
    volumes:
      - uploads_data_prod:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - peruana_net_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # 🗄️ MySQL Database (Production)
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: peruana_mysql_prod
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ./envs/.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - peruana_net_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # 🔴 Redis Cache (Production)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: peruana_redis_prod
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - peruana_net_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================
  # 💾 Backup Service
  # ============================================
  backup:
    image: alpine:latest
    container_name: peruana_backup_prod
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup_daemon.sh:/usr/local/bin/backup_daemon.sh:ro
      - uploads_data_prod:/app/uploads:ro
    env_file:
      - ./envs/.env.production
    command: >
      /bin/sh -c "apk add --no-cache mysql-client && 
      chmod +x /usr/local/bin/backup_daemon.sh && 
      /usr/local/bin/backup_daemon.sh"
    networks:
      - peruana_net_prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# ============================================
# 💾 Volumes (Persistent Data - Production)
# ============================================
volumes:
  mysql_data_prod:
    driver: local
  uploads_data_prod:
    driver: local
  redis_data_prod:
    driver: local

# ============================================
# 🌐 Networks (Production)
# ============================================
networks:
  peruana_net_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16