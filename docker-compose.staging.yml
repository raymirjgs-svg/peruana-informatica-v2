version: '3.8'

services:
  # ============================================
  # 🌐 Nginx Reverse Proxy (Staging)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: peruana_nginx_staging
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - peruana_net_staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 🎨 Frontend (Next.js Staging)
  # ============================================
  frontend:
    build:
      context: ./peruana-informatica/frontend
      dockerfile: Dockerfile.prod
    container_name: peruana_frontend_staging
    env_file:
      - ./envs/.env.staging
    environment:
      - NODE_ENV=staging
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - peruana_net_staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # ⚙️ Backend API (Node.js/Express Staging)
  # ============================================
  backend:
    build:
      context: ./peruana-informatica/backend
      dockerfile: Dockerfile.prod
    container_name: peruana_backend_staging
    env_file:
      - ./envs/.env.staging
    environment:
      - NODE_ENV=staging
      - PORT=3001
    expose:
      - "3001"
    volumes:
      - uploads_data_staging:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peruana_net_staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # 🗄️ MySQL Database (Staging)
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: peruana_mysql_staging
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ./envs/.env.staging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data_staging:/var/lib/mysql
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - peruana_net_staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# ============================================
# 💾 Volumes (Persistent Data - Staging)
# ============================================
volumes:
  mysql_data_staging:
    driver: local
  uploads_data_staging:
    driver: local

# ============================================
# 🌐 Networks (Staging)
# ============================================
networks:
  peruana_net_staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
