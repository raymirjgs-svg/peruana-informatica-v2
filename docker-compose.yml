version: '3.8'

services:
  nginx:
    image: nginx:alpine
    networks:
      - peruana_net
    # Ports, Volumes y Restart policies se definen en los overrides

  frontend:
    build:
      context: ./peruana-informatica/frontend
      dockerfile: Dockerfile.prod
    networks:
      - peruana_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # Environment variables se inyectan via env_file en overrides

  backend:
    build:
      context: ./peruana-informatica/backend
      dockerfile: Dockerfile.prod
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-peruanainformatica}
      DB_USER: ${MYSQL_USER:-peruana_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-peruana_pass123}
      DB_PORT: 3306
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peruana_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-peruanainformatica}
      MYSQL_USER: ${MYSQL_USER:-peruana_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-peruana_pass123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./scripts/init-db/database_backup.sql:/docker-entrypoint-initdb.d/database_backup:ro
    networks:
      - peruana_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}" ]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  uploads_data:


networks:
  peruana_net:
    driver: bridge
