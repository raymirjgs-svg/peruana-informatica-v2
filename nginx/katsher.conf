# ============================================
# Nginx HOST config — katsher.com
# Colocar en: /etc/nginx/sites-enabled/katsher.com
#
# Requisitos previos:
#   certbot --nginx -d katsher.com -d www.katsher.com
#   Contenedor katsher corriendo en 127.0.0.1:3005
# ============================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name katsher.com www.katsher.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://katsher.com$request_uri;
    }
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    server_name www.katsher.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/katsher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katsher.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://katsher.com$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name katsher.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/katsher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katsher.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Redirigir raíz al basePath de la app
    location = / {
        return 301 https://katsher.com/katsher;
    }

    # Imágenes estáticas de katsher
    location /katsher/images/ {
        alias /var/www/katsher/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la app katsher (puerto 3005)
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
