# ============================================
# Nginx HOST config — magnatte.es
# Colocar en: /etc/nginx/sites-enabled/magnatte.es
#
# Requisitos previos:
#   certbot --nginx -d magnatte.es -d www.magnatte.es
#   Contenedor magnatte corriendo en 127.0.0.1:3007
# ============================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name magnatte.es www.magnatte.es;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://magnatte.es$request_uri;
    }
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    server_name www.magnatte.es;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/magnatte.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magnatte.es/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://magnatte.es$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name magnatte.es;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/magnatte.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magnatte.es/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Redirigir raíz al basePath de la app
    location = / {
        return 301 https://magnatte.es/magnatte;
    }

    # Assets estáticos de magnatte
    location /magnatte/assets/ {
        proxy_pass         http://127.0.0.1:3007/magnatte/assets/;
        proxy_set_header   Host    $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la app magnatte (puerto 3007)
    location / {
        proxy_pass         http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
