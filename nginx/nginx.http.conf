events {
    worker_connections 1024;
}

http {
    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65;
    send_timeout 10s;
    client_max_body_size 10M;

    # Re-resolve DNS every 30s (Docker internal DNS)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    upstream katsher {
        server katsher_v2-app-1:3000;
    }

    # ============================================
    # Bloquear dominios sslip.io (no deben existir)
    # ============================================
    server {
        listen 80;
        server_name ~^.*\.sslip\.io$;
        server_tokens off;
        return 444;
    }

    # ============================================
    # Katsher site routing
    # ============================================
    server {
        listen 80;
        server_name katsher.com www.katsher.com;
        server_tokens off;

        location / {
            proxy_pass http://katsher;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # Peruana Informatica routing (default)
    # ============================================
    server {
        listen 80 default_server;
        server_name _;
        server_tokens off;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect root to basePath
        location = / {
            return 301 /peruanadeinformatica;
        }

        # Customer register/social-login → backend (exact match before NextAuth rule)
        location = /api/auth/login {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/register {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/social-login {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fix NextAuth session 308 redirect loop: proxy directly to trailing-slash version
        location = /api/auth/session {
            proxy_pass http://frontend/api/auth/session/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth API (must be before general /api/ rule)
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API Proxy
        location /api/ {
            limit_req zone=api_limit burst=100;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Uploads → proxy to backend /uploads/ (files stored in public/uploads/)
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend logo (exact match takes priority over /images/ backend rule)
        location = /images/logo.png {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Favicon served from frontend (with basePath prefix)
        location = /favicon.ico {
            proxy_pass http://frontend/peruanadeinformatica/favicon.ico;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Banner images served from frontend
        location /images/banners/ {
            proxy_pass http://frontend/images/banners/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Product Images Proxy - with 404 fallback to no-image placeholder
        location /images/ {
            proxy_pass http://backend/images/;
            proxy_set_header Host $host;
            proxy_intercept_errors on;
            error_page 404 = /images/no-image.svg;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend Proxy
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
