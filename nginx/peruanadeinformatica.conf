# ============================================
# Nginx HOST config — peruanadeinformatica.com.pe
# Colocar en: /etc/nginx/sites-enabled/peruanadeinformatica.com.pe
#
# Requisitos previos:
#   1. Instalar certbot: apt install certbot python3-certbot-nginx
#   2. Obtener certificado: certbot --nginx -d peruanadeinformatica.com.pe -d www.peruanadeinformatica.com.pe
#   3. Los contenedores Docker corriendo en 127.0.0.1:3000 (frontend) y 127.0.0.1:3001 (backend)
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=peruana_api:10m rate=30r/s;

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name peruanadeinformatica.com.pe www.peruanadeinformatica.com.pe;
    server_tokens off;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://peruanadeinformatica.com.pe$request_uri;
    }
}

# Redirect www → non-www HTTPS
server {
    listen 443 ssl http2;
    server_name www.peruanadeinformatica.com.pe;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/peruanadeinformatica.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peruanadeinformatica.com.pe/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://peruanadeinformatica.com.pe$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name peruanadeinformatica.com.pe;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/peruanadeinformatica.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peruanadeinformatica.com.pe/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Privacidad: el codigo de seguimiento funciona como credencial.
    # No debe filtrarse como Referer hacia terceros.
    add_header Referrer-Policy "no-referrer" always;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Health check ─────────────────────────────────────────────
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── NextAuth: rutas exactas que van al backend ────────────────
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/social-login {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # NextAuth (debe ir ANTES de /api/)
    location /api/auth/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API ───────────────────────────────────────────────
    # Security containment: order details require secure tracking codes.
    # Temporary block until /orders/:tracking_code is deployed.
    location ~* ^/api/client/orders(?:/|$) {
        return 404;
    }

    location /api/ {
        limit_req zone=peruana_api burst=100 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /payment-proofs/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # ── Archivos subidos desde el panel (logo/favicon) ───────────
    # Los uploads de company-settings viven en el volumen del backend,
    # no en el directorio de imagenes de producto: se delegan al backend
    # para no servir un placeholder y dejar el logo en blanco.
    location ~* ^/uploads/settings/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Referrer-Policy "no-referrer" always;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Archivos subidos (uploads) ────────────────────────────────
    location /uploads/ {
        alias /var/www/images/products/;
        try_files $uri /no-image.svg;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Logo del sitio (frontend) ─────────────────────────────────
    location = /images/logo.png {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Banners (frontend) ────────────────────────────────────────
    location /images/blog/ {
        alias /var/www/images/blog/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/brands/ {
        alias /var/www/images/brands/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/banners/ {
        proxy_pass       http://127.0.0.1:3000/images/banners/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Imágenes de productos (backend, con fallback) ─────────────
    location /images/ {
        proxy_pass              http://127.0.0.1:3001/images/;
        proxy_set_header        Host      $host;
        proxy_intercept_errors  on;
        error_page 404 = /no-image.svg;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Tracking privado ──────────────────────────────────────────
    # El codigo de seguimiento es una credencial bearer: se desactiva el
    # access_log para que nunca quede en texto plano en /var/log/nginx.
    location ~* ^/api/orders/track/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* ^/seguimiento/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }

    # ── Frontend ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }
}
