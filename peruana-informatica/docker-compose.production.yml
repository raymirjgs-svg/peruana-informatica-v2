version: '3.8'

services:
  # ==========================================
  # ⚙️ Backend Service
  # ==========================================
  backend:
    container_name: peruana-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env.production
    ports:
      - "3001:3001"
    volumes:
      - ./backend_data/uploads:/app/public/uploads
      - ./backend_data/logs:/app/logs
    networks:
      - app-network
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

  # ==========================================
  # 🌐 Frontend Service
  # ==========================================
  frontend:
    container_name: peruana-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  # ==========================================
  # 🗄️ Database (MySQL)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: peruana-db
    restart: always
    environment:
      # --- FIX: Variables correctas para inicializar MySQL ---
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # 🚀 Redis
  # ==========================================
  redis:
    image: redis:alpine
    container_name: peruana-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 🛡️ Nginx
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: peruana-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
