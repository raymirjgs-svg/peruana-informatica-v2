services:
  db:
    image: mysql:8
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://${PUBLIC_IP:-localhost}
    restart: always
    env_file:
      - .env
    depends_on:
      - backend

  redis:
    image: redis:alpine
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
      - redis

volumes:
  mysql_data:
  redis_data:
