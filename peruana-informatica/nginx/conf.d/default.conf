server {
    listen 80;
    server_name localhost;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compresión Gzip para mejorar performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==================================
    # 🩺 Health Check
    # ==================================
    location /health {
        proxy_pass http://backend:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ==================================
    # ⚙️ Backend API
    # ==================================
    # Nota: Quitamos trailing slash en proxy_pass para pasar el path completo
    location /api {
        proxy_pass http://backend:3001; 
        
        # Headers esenciales
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts extendidos para uploads o procesos largos
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ==================================
    # 🖼️ Static Files (Images/Uploads)
    # ==================================
    location /images {
        proxy_pass http://backend:3001/images;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    location /uploads {
        proxy_pass http://backend:3001/uploads;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==================================
    # 🌐 Frontend (Next.js)
    # ==================================
    location / {
        proxy_pass http://frontend:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
